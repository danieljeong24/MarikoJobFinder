[project]
name = "job-watch"
version = "0.1.0"
description = "Weekly watcher for entry-level civil/transportation engineering jobs in Las Vegas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]

[project.scripts]
job-watch = "job_watch.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
